# Kubernetes networking: bridged pod traffic goes through netfilter,
# and the node routes between pods and the outside.
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
# The values kubelet expects (it sets them itself; stated here so the
# guest is right before kubelet starts).
vm.overcommit_memory = 1
kernel.panic = 10
kernel.panic_on_oops = 1
# The dev-shell's `unshare -mUr` needs unprivileged user namespaces.
# CONFIG_USER_NS=y; this makes the ceiling explicit.
user.max_user_namespaces = 15000
# containerd, kubelet and every agent's CLI watch files.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
