# vsock is for the host alone (the guest agent, kivali-guest, serves
# kivali-supervisor on it). vsock_loopback would let a guest process
# connect to a guest vsock port, and vhost_vsock would make the guest a
# vsock host itself; neither may ever load, whatever asks for them.
# `blacklist` stops alias autoloading; `install ... /bin/false` makes an
# explicit modprobe fail too. The agent also refuses any peer CID but
# the host's (2).
#
# hv_sock is allowed and deliberately not listed: it is the Hyper-V
# vsock transport, the guest side of Hyper-V sockets, through which the
# Windows host reaches the agent, as vmw_vsock_virtio_transport is on
# Virtualization.framework. Both only connect the guest to its host.
blacklist vsock_loopback
install vsock_loopback /bin/false
blacklist vhost_vsock
install vhost_vsock /bin/false
