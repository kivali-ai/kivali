<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.l{font:var(--type-label);letter-spacing:.02em;color:var(--ink-muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}.n{font:500 12px/16px var(--font-mono)}.v{font:400 11px/14px var(--font-mono);color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:110px 1fr;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)"><span class="l">display · 56px/60px</span><span style="font:var(--type-display);letter-spacing:var(--type-display-tracking);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Hire your first agent</span></div><div style="display:grid;grid-template-columns:110px 1fr;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)"><span class="l">title · 32px/38px</span><span style="font:var(--type-title);letter-spacing:var(--type-title-tracking);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Garden advisor</span></div><div style="display:grid;grid-template-columns:110px 1fr;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)"><span class="l">heading · 20px/28px</span><span style="font:var(--type-heading);letter-spacing:var(--type-heading-tracking);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">What it remembers</span></div></body></html>
