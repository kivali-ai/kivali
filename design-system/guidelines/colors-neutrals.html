<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.l{font:var(--type-label);letter-spacing:.02em;color:var(--ink-muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}.n{font:500 12px/16px var(--font-mono)}.v{font:400 11px/14px var(--font-mono);color:var(--ink-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--paper)"></div><span class="n">paper</span><span class="v">#F6F3EA</span></div><div class="sw"><div class="chip" style="background:var(--paper-raised)"></div><span class="n">paper-raised</span><span class="v">#FCFAF5</span></div><div class="sw"><div class="chip" style="background:var(--line)"></div><span class="n">line</span><span class="v">#E2DDD1</span></div><div class="sw"><div class="chip" style="background:var(--ink-faint)"></div><span class="n">ink-faint</span><span class="v">#8D8980</span></div><div class="sw"><div class="chip" style="background:var(--ink-muted)"></div><span class="n">ink-muted</span><span class="v">#615D55</span></div><div class="sw"><div class="chip" style="background:var(--ink)"></div><span class="n">ink</span><span class="v">#24211C</span></div></div></body></html>
