<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.l{font:var(--type-label);letter-spacing:.02em;color:var(--ink-muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}.n{font:500 12px/16px var(--font-mono)}.v{font:400 11px/14px var(--font-mono);color:var(--ink-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--signal)"></div><span class="n">signal</span><span class="v">#EDBE52</span></div><div class="sw"><div class="chip" style="background:var(--signal-soft)"></div><span class="n">signal-soft</span><span class="v">#FBEFCB</span></div><div class="sw"><div class="chip" style="background:var(--signal-ink)"></div><span class="n">signal-ink</span><span class="v">#7A5800</span></div><div class="sw"><div class="chip" style="background:var(--cobalt)"></div><span class="n">cobalt</span><span class="v">#3F53A8</span></div><div class="sw"><div class="chip" style="background:var(--cobalt-soft)"></div><span class="n">cobalt-soft</span><span class="v">#E3E6F3</span></div></div></body></html>
