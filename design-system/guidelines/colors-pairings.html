<!-- @dsCard group="Colors" viewport="700x120" name="On-colors" subtitle="Text on fills: on-ink, on-signal, on-cobalt" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.l{font:var(--type-label);letter-spacing:.02em;color:var(--ink-muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}.n{font:500 12px/16px var(--font-mono)}.v{font:400 11px/14px var(--font-mono);color:var(--ink-muted)}</style></head><body><div class="row"><div style="background:var(--ink);color:var(--on-ink);padding:10px 14px;border-radius:var(--radius-md);font:500 14px/20px var(--font-sans)">Hire agent</div><div style="background:var(--signal);color:var(--on-signal);padding:10px 14px;border-radius:var(--radius-md);font:500 14px/20px var(--font-sans)">Live</div><div style="background:var(--cobalt);color:var(--on-cobalt);padding:10px 14px;border-radius:var(--radius-md);font:500 14px/20px var(--font-sans)">Learned 3 things</div><div style="background:var(--success);color:var(--on-success);padding:10px 14px;border-radius:var(--radius-md);font:500 14px/20px var(--font-sans)">Approved</div><div style="background:var(--danger);color:var(--on-danger);padding:10px 14px;border-radius:var(--radius-md);font:500 14px/20px var(--font-sans)">Offboard</div></div><p class="l" style="margin:14px 0 0">Signal text is always on-signal ink, never white</p></body></html>
