<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.l{font:var(--type-label);letter-spacing:.02em;color:var(--ink-muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}.n{font:500 12px/16px var(--font-mono)}.v{font:400 11px/14px var(--font-mono);color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:110px 1fr;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)"><span class="l">body · 15px/24px</span><span style="font:var(--type-body);letter-spacing:var(--type-body-tracking);">Checks the forecast each morning and flags anything unusual before you water.</span></div><div style="display:grid;grid-template-columns:110px 1fr;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)"><span class="l">caption · 13px/18px</span><span style="font:var(--type-caption);letter-spacing:var(--type-caption-tracking);;color:var(--ink-muted)">Last updated 4 minutes ago</span></div></body></html>
