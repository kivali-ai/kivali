<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.l{font:var(--type-label);letter-spacing:.02em;color:var(--ink-muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}.n{font:500 12px/16px var(--font-mono)}.v{font:400 11px/14px var(--font-mono);color:var(--ink-muted)}</style></head><body><div class="row" style="gap:20px"><div class="sw" style="width:120px"><div style="height:64px;background:var(--paper-raised);border:1px solid var(--ink-faint);border-radius:var(--radius-sm)"></div><span class="n">radius-sm</span><span class="v">6px</span></div><div class="sw" style="width:120px"><div style="height:64px;background:var(--paper-raised);border:1px solid var(--ink-faint);border-radius:var(--radius-md)"></div><span class="n">radius-md</span><span class="v">10px</span></div><div class="sw" style="width:120px"><div style="height:64px;background:var(--paper-raised);border:1px solid var(--ink-faint);border-radius:var(--radius-lg)"></div><span class="n">radius-lg</span><span class="v">16px</span></div><div class="sw" style="width:120px"><div style="height:64px;background:var(--paper-raised);border:1px solid var(--ink-faint);border-radius:var(--radius-full)"></div><span class="n">radius-full</span><span class="v">9999px</span></div></div></body></html>
