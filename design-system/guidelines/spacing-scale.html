<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.l{font:var(--type-label);letter-spacing:.02em;color:var(--ink-muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}.n{font:500 12px/16px var(--font-mono)}.v{font:400 11px/14px var(--font-mono);color:var(--ink-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:12px"><span class="n" style="width:70px">space-1</span><span style="height:14px;width:4px;background:var(--cobalt);border-radius:3px"></span><span class="v">4px · Icon-to-label gap, chip padding.</span></div><div style="display:flex;align-items:center;gap:12px"><span class="n" style="width:70px">space-2</span><span style="height:14px;width:8px;background:var(--cobalt);border-radius:3px"></span><span class="v">8px · Inside controls, between tight rows.</span></div><div style="display:flex;align-items:center;gap:12px"><span class="n" style="width:70px">space-4</span><span style="height:14px;width:16px;background:var(--cobalt);border-radius:3px"></span><span class="v">16px · Card padding, gaps in a grid, the dot-grid pitch.</span></div><div style="display:flex;align-items:center;gap:12px"><span class="n" style="width:70px">space-6</span><span style="height:14px;width:24px;background:var(--cobalt);border-radius:3px"></span><span class="v">24px · Between groups within a section.</span></div><div style="display:flex;align-items:center;gap:12px"><span class="n" style="width:70px">space-8</span><span style="height:14px;width:32px;background:var(--cobalt);border-radius:3px"></span><span class="v">32px · Between sections; page gutters.</span></div></div></body></html>
