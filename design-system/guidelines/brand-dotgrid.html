<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.l{font:var(--type-label);letter-spacing:.02em;color:var(--ink-muted)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.chip{height:56px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--line)}.n{font:500 12px/16px var(--font-mono)}.v{font:400 11px/14px var(--font-mono);color:var(--ink-muted)}</style></head><body><div style="margin:-20px;height:150px;background-image:radial-gradient(circle,var(--ink-faint) 1.5px,transparent 1.6px);background-size:16px 16px;background-position:8px 8px;display:flex;align-items:center;gap:16px;padding:0 40px"><span style="width:72px;height:72px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 1.5px var(--ink)"></span><span style="width:64px;height:88px;border-radius:999px;background:var(--cobalt)"></span></div></body></html>
