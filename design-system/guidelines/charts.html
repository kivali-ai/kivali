<!-- @dsCard group="Colors" viewport="700x430" name="Chart palette" subtitle="Series, sequential and diverging" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}
.lbl{font:500 11px/16px var(--font-mono);letter-spacing:.02em;color:var(--ink-muted);margin:0 0 8px}
.sw{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.sw div{display:flex;flex-direction:column;align-items:center;gap:4px;font:400 10px var(--font-mono);color:var(--ink-muted)}
.sw span{width:44px;height:24px;border-radius:4px}
.wrap{display:flex;gap:24px;flex-wrap:wrap}.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px}
.legend{display:flex;gap:14px;font:400 12px/16px var(--font-sans);color:var(--ink-muted);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
text{font:400 11px var(--font-mono);fill:var(--ink-muted)}
</style></head><body>
<p class="lbl">Series order · 1 to 8</p>
<div class="sw" id="sw"></div>
<div class="wrap">
<div class="card"><p class="lbl">Tokens by agent, last 5 weeks</p><svg id="bars" width="300" height="150"></svg><div class="legend" id="lg"></div></div>
<div class="card"><p class="lbl">Sequential · seq-1 to seq-5</p><div class="sw" id="seq" style="margin:0 0 12px"></div><p class="lbl">Diverging · clay, mid, lake</p><div class="sw" id="div" style="margin:0"></div></div>
</div>
<script>
const S=["lake","olive","rose","ochre","plum","pine","clay","iris"];
document.getElementById("sw").innerHTML=S.map((s,i)=>`<div><span style="background:var(--chart-${s})"></span>${i+1} ${s}</div>`).join("");
document.getElementById("seq").innerHTML=[1,2,3,4,5].map(i=>`<div><span style="background:var(--seq-${i})"></span>${i}</div>`).join("");
document.getElementById("div").innerHTML=["chart-clay","diverging-mid","chart-lake"].map(v=>`<div><span style="background:var(--${v})"></span>${v.replace("chart-","")}</div>`).join("");
const A=[["Chief of Staff","iris"],["Garden advisor","olive"],["Supplier scout","clay"]];
const data=[[40,22,18],[52,30,12],[38,26,24],[60,20,30],[48,34,20]];
const max=110,H=120,bw=36,gap=20,x0=28;let g=`<line x1="${x0}" y1="${H}" x2="296" y2="${H}" stroke="var(--line)"/>`;
[0,50,100].forEach(v=>{const y=H-v/max*H;g+=`<text x="0" y="${y+4}">${v}k</text>`;if(v)g+=`<line x1="${x0}" y1="${y}" x2="296" y2="${y}" stroke="var(--line)" stroke-dasharray="2 3"/>`});
data.forEach((d,i)=>{let y=H;const x=x0+10+i*(bw+gap);d.forEach((v,j)=>{const h=v/max*H;y-=h;g+=`<rect x="${x}" y="${y+1}" width="${bw}" height="${h-2}" rx="${j===d.length-1?4:0}" fill="var(--chart-${A[j][1]})"><title>${A[j][0]}: ${v}k tokens</title></rect>`});g+=`<text x="${x+6}" y="${H+16}">W${i+1}</text>`;});
document.getElementById("bars").innerHTML=g;
document.getElementById("lg").innerHTML=A.map(([n,c])=>`<span><i style="background:var(--chart-${c})"></i>${n}</span>`).join("");
</script></body></html>
