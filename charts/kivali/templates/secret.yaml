{{- if .Values.secrets.create }}
{{- if not .Values.devMode }}
{{- $_ := required "secrets.create with devMode false needs secrets.ownerEmails" .Values.secrets.ownerEmails }}
{{- $_ := required "secrets.create with devMode false needs secrets.sessionKey" .Values.secrets.sessionKey }}
{{- /* An own Google client is all three or none: the public client needs none of them. */ -}}
{{- if or .Values.secrets.googleOAuthClientID .Values.secrets.googleOAuthClientSecret }}
{{- $_ := required "an own OAuth client needs secrets.googleOAuthClientID" .Values.secrets.googleOAuthClientID }}
{{- $_ := required "an own OAuth client needs secrets.googleOAuthClientSecret" .Values.secrets.googleOAuthClientSecret }}
{{- $_ := required "an own OAuth client needs secrets.oauthRedirectURL (the redirect URI registered on it)" .Values.secrets.oauthRedirectURL }}
{{- end }}
{{- end }}
# Single-user installs only: these values are readable from the Helm release record.
apiVersion: v1
kind: Secret
metadata:
  name: kivali-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kivali.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.ownerEmails }}
  owner-emails: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oauthRedirectURL }}
  oauth-redirect-url: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleOAuthClientID }}
  google-oauth-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleOAuthClientSecret }}
  google-oauth-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sessionKey }}
  session-key: {{ . | quote }}
  {{- end }}
{{- end }}
