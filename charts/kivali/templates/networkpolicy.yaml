{{- if .Values.networkPolicy.enabled }}
# Agents run shell commands in pods. These policies keep agent, browser and
# integration pods off the cluster, the node and cloud metadata. Four
# policies; they take effect only on a cluster whose CNI enforces
# NetworkPolicy (k3s's embedded network policy controller does).
#
# 1. Agent pods: egress default deny, then only the egress proxy. This is
#    the load-bearing one: an agent pod reaches nothing but the proxy, which
#    holds the agent's shell to the team's host list and lets the agent's
#    own fetches reach the public web. No DNS: agent pods reach the proxy
#    by IP, and clients that use it hand host names to it, so a lookup can
#    carry nothing out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivali-agentpod-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kivali.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kivali-agentpod
  policyTypes: [Egress]
  egress:
    # The egress proxy sidecar runs in the server pod. Agent pods reach
    # core over the hostPath Unix socket, not the network.
    - to:
        - podSelector:
            matchLabels:
              app: kivali
      ports:
        - protocol: TCP
          port: 3128
---
# 2. Browser pods: the web and DNS, nothing in the cluster, and no
#    ingress at all. A browser browses the web for a web subagent directly,
#    with no proxy, and is not held to the allowlist; it reaches core over
#    the hostPath Unix socket, not the network. The exceptions keep
#    Chromium, and any page that drives it, off the pod network, the node,
#    cloud metadata (the link-local range and Azure's WireServer) and every
#    private range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivali-browserpod-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kivali.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kivali-browserpod
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ .Values.networkPolicy.podCIDR }}
              {{- range .Values.networkPolicy.browserEgress.except }}
              - {{ . }}
              {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. Server pod, defence in depth: the HTTP port only from outside the pod
#    network, the proxy port only from pods in this namespace. On k3s
#    kube-router evaluates policy before kube-proxy's SNAT and accepts
#    traffic from the local node ahead of every pod chain, so kubelet
#    probes and host-forwarded NodePort traffic are admitted, while a pod's
#    request to the NodePort is dropped with its real pod address. The
#    cost: any in-cluster front end (Traefik, cloudflared, Tailscale
#    operator pods) is also a pod and is blocked; admit it with
#    networkPolicy.serverIngress.extraFrom.
{{- if .Values.networkPolicy.serverIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivali-server-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kivali.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kivali
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ .Values.networkPolicy.podCIDR }}
        {{- with .Values.networkPolicy.serverIngress.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3128
{{- end }}
---
# 4. Integration pods: egress default deny, then only the egress proxy, as
#    for agent pods. An integration's server reaches the hosts its approved
#    version names through the proxy, which holds its scoped credential to
#    them, and nothing else. No DNS: the pod reaches the proxy by IP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kivali-integrationpod-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kivali.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: kivali-integrationpod
  policyTypes: [Egress]
  egress:
    # The egress proxy sidecar runs in the server pod. Integration pods
    # reach core over the hostPath Unix socket, not the network.
    - to:
        - podSelector:
            matchLabels:
              app: kivali
      ports:
        - protocol: TCP
          port: 3128
{{- end }}
