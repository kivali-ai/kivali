# Release
#
# Two ways in:
#
#   a release    a pushed release tag (scripts/release.sh pushes vX.Y.Z
#                together with the version bump) publishes the GitHub
#                release that Kivali Desktop and every Kivali org consume:
#                signed, notarized, with the updater's feed
#   a dev build  run by hand (Actions, Release, Run workflow) on any
#                branch: the same builds with no tag and no signing
#                material, published as the pre-release
#                vX.Y.Z-dev.<run number> (X.Y.Z the tree's version), its
#                tag created on the commit built. The macOS app is ad-hoc
#                signed and not notarized, neither app carries updater
#                artifacts, and there is no latest.json. A pre-release is
#                skipped by GitHub's /releases/latest, so neither the
#                updater nor a feed check ever offers a dev build.
#
# docs/developers/releasing.md is the procedure: the secrets a release
# needs, how the updater and the org upgrade read the result, how to roll
# a release back.
#
#   checks           ci.yml, called: every per-commit check, Kivali
#                    Desktop's on macOS and Windows among them
#   nightly          nightly.yml, called: the race detector and the
#                    integration suite
#   verify           the version: the tag, or the dev build's. For a
#                    release, the tag is vX.Y.Z and every versioned file
#                    says X.Y.Z (make version-check), failing first and
#                    saying why: the desktop's tauri.conf.json version
#                    must equal the tag. It also checks every signing
#                    secret is set (listing the missing ones) and that the
#                    updater public key is not the development one, so
#                    none of that is discovered after the images and the
#                    VM images have been built.
#   chart            kivali-X.Y.Z.tgz
#   images           one native runner per architecture: the four images
#                    (kivali, kivali-egress-proxy, kivali-agent-shell,
#                    kivali-browser) saved together and zstd-compressed,
#                    kivali-images-linux-<arch>.tar.zst, the single
#                    archive the supervisor imports; the Debian package
#                    lists of kivali, kivali-agent-shell and kivali-browser, for
#                    SOURCES.md; and the VM image for the desktop platform
#                    of that architecture, with its images (uncompressed,
#                    compressed meanwhile for the release) and the chart
#                    baked in: arm64 for macOS (Image, initramfs.gz,
#                    root.squashfs), amd64 for Windows (root.vhdx); each
#                    with packages.txt and SOURCES.md
#   licenses         THIRD_PARTY_LICENSES.txt, the notices of everything a
#                    release ships (make third-party-licenses). The apps
#                    bundle the same file; each image also carries its
#                    own, written as it is built.
#   feed             release.json: the supervisor's update feed, with the
#                    sha256 of the chart and the image bundles
#   desktop-macos    Kivali.app on macos-15 (arm64): the supervisor sidecar
#                    stamped with the version, the arm64 VM image bundled,
#                    signed with a Developer ID certificate, notarized,
#                    shipped as Kivali_X.Y.Z_aarch64.dmg plus the
#                    updater's Kivali.app.tar.gz and .sig
#   desktop-windows  the per-machine NSIS installer on windows-latest
#                    (x64): the supervisor sidecar stamped with the
#                    version, the amd64 VM image bundled, the sidecar,
#                    Kivali.exe, the uninstaller and the installer
#                    Authenticode-signed through Azure Artifact Signing
#                    (desktop-app/scripts/sign-windows.ps1), shipped as
#                    Kivali_X.Y.Z_x64-setup.exe, which is also the
#                    updater's artifact, and its .sig
#   publish          waits for checks and nightly as well as the builds; a
#                    failed test publishes nothing. Writes latest.json for
#                    tauri-plugin-updater, covering both platforms. One
#                    draft release, every asset uploaded, then published.
#                    SOURCES.md (the GPL and LGPL sources and the written
#                    offer) is the arm64 VM image's with the images'
#                    Debian packages appended; vm-amd64-SOURCES.md is the
#                    amd64 VM image's, which adds the EFI stub. The VM
#                    images themselves are not release assets: each ships
#                    inside its platform's installer.
#                    A pre-release tag (vX.Y.Z-rc1) is published as a
#                    pre-release, which GitHub's /releases/latest skips,
#                    so the updater never offers it.
#
# NOT RUN HERE: the VM boot test (make -C vm boottest). It needs
# Virtualization.framework, which GitHub-hosted macOS runners cannot
# offer (no nested virtualization on Apple Silicon runners), so nothing in
# this workflow boots the image. Run `make -C vm boottest` on a Mac against
# the run's vm-arm64 artifact before announcing a release.
#
# SmartScreen's reputation for the Windows installer follows the signing
# identity and grows with installs, so it may still warn on a new
# identity's first releases. Updates are verified either way, by the
# updater's own signature.
#
# Secrets (Settings -> Secrets and variables -> Actions; docs/developers/releasing.md
# says where each comes from). A release needs all of them, and the
# verify job checks them first and lists every missing one; a dev build
# needs none:
#
#   APPLE_CERTIFICATE                 base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD        the .p12's export password
#   KEYCHAIN_PASSWORD                 any string; protects the job's temporary keychain
#   APPLE_SIGNING_IDENTITY            "Developer ID Application: Name (TEAMID)"
#   notarization, ONE of:
#     APPLE_ID, APPLE_PASSWORD (an app-specific password), APPLE_TEAM_ID
#     APPLE_API_KEY (key id), APPLE_API_ISSUER, APPLE_API_KEY_P8 (base64 of the .p8)
#   TAURI_SIGNING_PRIVATE_KEY         the updater's private key (the file's contents);
#                                     both platforms' updates are signed with it
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (may be empty)
#   AZURE_TENANT_ID                   the Entra tenant of the Azure subscription
#   AZURE_CLIENT_ID                   the app registration holding the Artifact Signing
#                                     Certificate Profile Signer role on the account
#   AZURE_CLIENT_SECRET               its client secret
#   ARTIFACT_SIGNING_ENDPOINT         the account's regional endpoint,
#                                     https://<region>.codesigning.azure.net
#   ARTIFACT_SIGNING_ACCOUNT          the Artifact Signing account name
#   ARTIFACT_SIGNING_PROFILE          the certificate profile name
#
# GITHUB_TOKEN (automatic) publishes the release.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

# One run per tag or branch. A second run waits for the first rather
# than cancelling a half-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  nightly:
    name: Nightly
    uses: ./.github/workflows/nightly.yml

  verify:
    name: Version and signing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Every later job reads the version (and whether this is a dev build)
    # from here, as TAG.
    outputs:
      version: ${{ steps.version.outputs.version }}
      dev: ${{ steps.version.outputs.dev }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Version
        id: version
        run: |
          conf="$(jq -r .version desktop-app/src-tauri/tauri.conf.json)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="v$conf-dev.$GITHUB_RUN_NUMBER"
            echo "::notice title=Dev build::$version, from $GITHUB_REF_NAME at $GITHUB_SHA: unsigned, no updater artifacts, published as a pre-release."
            dev=true
          else
            version="$GITHUB_REF_NAME"
            # tauri.conf.json's version is the desktop's; the tag is
            # everyone else's. A release cut by hand (not
            # scripts/release.sh) is where these drift, so say exactly
            # which one is wrong.
            if [ "v$conf" != "$version" ]; then
              echo "::error title=Version mismatch::tag $version but desktop-app/src-tauri/tauri.conf.json says version $conf. Run scripts/release.sh (it bumps every versioned file together) and tag the release commit it makes; nothing was built."
              exit 1
            fi
            dev=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"

      # A dev build stamps its own version into the desktop's files (the
      # desktop jobs run scripts/bump-version.sh); the tree's files must
      # still agree with one another.
      - name: Every versioned file agrees
        env:
          TAG: ${{ steps.version.outputs.version }}
          DEV: ${{ steps.version.outputs.dev }}
        run: |
          if [ "$DEV" = true ]; then make version-check; else make version-check VERSION="$TAG"; fi

      # Everything a signed, notarized, updatable app needs, checked
      # here, first, so a missing secret fails in seconds and not after
      # the images and the VM images have been built (the tag is already
      # pushed by then, and its version number spent). Secrets are
      # readable from any job; only their presence is tested.
      - name: Signing material is present
        if: steps.version.outputs.dev != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
        run: |
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY TAURI_SIGNING_PRIVATE_KEY AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -z "$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ] && [ -z "$APPLE_API_KEY$APPLE_API_ISSUER$APPLE_API_KEY_P8" ]; then
            missing="$missing (notarization: APPLE_ID+APPLE_PASSWORD+APPLE_TEAM_ID, or APPLE_API_KEY+APPLE_API_ISSUER+APPLE_API_KEY_P8)"
          elif [ -n "$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ] && { [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
            missing="$missing (notarization: APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID go together)"
          elif [ -z "$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ] && { [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; }; then
            missing="$missing (notarization: APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_P8 go together)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Release secrets missing::A release needs these repository secrets, which are not set:$missing. See docs/developers/releasing.md. To build without them, run this workflow by hand for a dev build."
            exit 1
          fi

      - name: Updater public key is the owner's
        if: steps.version.outputs.dev != 'true'
        run: bash scripts/check-updater-key.sh

  images:
    name: Images and VM image (${{ matrix.arch }})
    needs: [verify, chart]
    # One native runner per architecture, no QEMU: the images and the VM's
    # root disk are built under Docker BuildKit for linux/<arch>. arm64's
    # VM image is the macOS app's (Virtualization.framework boots the
    # kernel, initramfs and squashfs), amd64's the Windows app's (Hyper-V
    # boots root.vhdx, which holds all three).
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            vm-files: root.vhdx packages.txt SOURCES.md VERSION
          - arch: arm64
            runner: ubuntu-24.04-arm
            vm-files: Image initramfs.gz root.squashfs packages.txt SOURCES.md VERSION
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TAG: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'
          cache: true

      # Builds the four images and saves them together, uncompressed:
      # dist/images/bundle-<arch>/kivali-images.tar. The bundle script
      # checks it lists all four references at the version.
      - name: make release-images-${{ matrix.arch }}
        run: make release-images-${{ matrix.arch }} VERSION="$TAG"

      # The images' Debian packages, for the release's SOURCES.md. The
      # bundle script left the images loaded.
      - name: Package lists
        run: |
          mkdir -p dist/sources
          for img in kivali kivali-agent-shell kivali-browser; do
            id="$(docker create "$img:$TAG")"
            docker cp "$id:/usr/share/doc/kivali/packages.txt" "dist/sources/$img-linux-${{ matrix.arch }}.txt"
            docker rm "$id"
          done
          ls -l dist/sources

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sources-${{ matrix.arch }}
          path: dist/sources/*.txt
          retention-days: 7
          if-no-files-found: error

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chart
          path: dist

      # The root disk bakes the uncompressed bundle (squashfs compresses
      # better from a plain tar) and the chart, so a first install needs
      # no download. Compressing the bundle into the release asset,
      # dist/kivali-images-linux-<arch>.tar.zst, takes minutes too, so it
      # runs alongside.
      - name: make vm-release, and release-compress-${{ matrix.arch }} alongside
        run: |
          make release-compress-${{ matrix.arch }} VERSION="$TAG" > "$RUNNER_TEMP/compress.log" 2>&1 &
          compress=$!
          make vm-release VERSION="$TAG" VM_ARCH=${{ matrix.arch }}
          status=0
          wait "$compress" || status=$?
          cat "$RUNNER_TEMP/compress.log"
          exit "$status"

      - name: Collect the VM image
        run: |
          mkdir -p vm-artifacts vm-sources
          for f in ${{ matrix.vm-files }}; do cp "vm/build/out/$f" vm-artifacts/; done
          cp vm/build/out/packages.txt vm/build/out/SOURCES.md vm-sources/
          ls -l vm-artifacts vm-sources

      # The VM image, for the desktop job that bundles it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-${{ matrix.arch }}
          path: vm-artifacts/*
          retention-days: 7
          if-no-files-found: error

      # Its package list and SOURCES.md alone, which the release
      # publishes: publish need not download the image for them.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-sources-${{ matrix.arch }}
          path: vm-sources/*
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images-${{ matrix.arch }}
          path: dist/kivali-images-linux-${{ matrix.arch }}.tar.zst
          retention-days: 7
          if-no-files-found: error

  chart:
    name: Chart
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.4

      - name: Package the chart
        run: make chart-package VERSION="$TAG"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chart
          path: dist/kivali-*.tgz
          retention-days: 7
          if-no-files-found: error

  licenses:
    name: Third-party licenses
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: make web-install
        run: make web-install

      # cargo (the runner's stable rustup) reads the shell's crates from
      # the registry; jq is on the runner.
      - name: make third-party-licenses
        run: make third-party-licenses

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: licenses
          path: dist/licenses/*.txt
          retention-days: 7
          if-no-files-found: error

  feed:
    name: release.json
    needs: [verify, images, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: images-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chart
          path: dist

      - name: make release-feed
        run: make release-feed VERSION="$TAG"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-json
          path: dist/release.json
          retention-days: 7
          if-no-files-found: error

  desktop-macos:
    name: Kivali Desktop (macOS arm64)
    needs: [verify, images]
    runs-on: macos-15
    # Notarization is Apple's queue: usually minutes, sometimes far
    # longer, and a run that times out has to submit again.
    timeout-minutes: 180
    # Only the version here: the secrets go to "Sign, notarize and
    # package" alone, after the project's dependencies have run.
    env:
      TAG: ${{ needs.verify.outputs.version }}
      DEV: ${{ needs.verify.outputs.dev }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop-app/package-lock.json

      # Pinned in lockstep with desktop-app/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: '1.99.0'

      # The release profile's dependencies, from nightly.yml's package
      # job on main. Never saved here: a cache written on a tag is
      # readable by that tag alone, and a dev build's branch reads main's.
      # The key must match nightly.yml's, so only the pinned toolchain is
      # installed here too.
      - name: Only the pinned Rust toolchain
        uses: ./.github/actions/only-pinned-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v0-rust-1.99.0
          shared-key: desktop-release
          workspaces: desktop-app/src-tauri
          save-if: false

      # A dev build's version, in the desktop's files for this build only
      # (not committed): the app and its sidecar report it.
      - name: Dev version
        if: env.DEV == 'true'
        run: bash scripts/bump-version.sh "$TAG"

      # The VM image the images job built, bundled into the app as
      # Contents/Resources/vm (desktop-app/Makefile VM_BUNDLE).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vm-arm64
          path: vm/build/out

      # Everything the app is made of, with no secret in reach: the web
      # app, every crate with its build script and macros, the sidecar
      # and the license notices (make desktop-release-compile). The
      # project's dependencies run here and only here.
      - name: Compile
        run: make desktop-release-compile VERSION="$TAG"

      # Signing, notarization and packaging in one step, the only one that
      # holds a secret, so nothing reaches GITHUB_ENV (and with it later
      # steps and actions' post steps). It runs the tauri CLI and Apple's
      # tools on what Compile built (make desktop-release-bundle: sign,
      # notarize, staple, dmg, updater artifacts) and copies the dmg,
      # Kivali.app.tar.gz and its .sig into dist/.
      #
      # A temporary keychain holds the Developer ID certificate, on the
      # search list so codesign finds the identity and its chain. The step
      # fails here unless that identity is valid, rather than inside the
      # bundler. Unused variables are unset: tauri treats a variable that is
      # set but empty as present, and an empty APPLE_ID would send it down
      # the Apple-ID notarization path even when an API key is in use. The
      # certificate is imported here, so APPLE_CERTIFICATE is unset too:
      # tauri would import it a second time. Tauri waits on notarization
      # without a word, so scripts/notary-progress.sh prints Apple's status
      # for the submission once a minute until the bundle ends. DEV= on
      # make's command line keeps the job's DEV (false) from reaching it.
      - name: Sign, notarize and package
        if: env.DEV != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cert="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$cert" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$cert"
          read -r -a searched <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s build.keychain "${searched[@]}"
          identities="$(security find-identity -v -p codesigning build.keychain)"
          echo "$identities"
          if ! grep -qF "\"$APPLE_SIGNING_IDENTITY\"" <<< "$identities"; then
            echo "::error title=Signing identity::APPLE_SIGNING_IDENTITY is not a valid code-signing identity in the imported certificate (above). Check APPLE_CERTIFICATE (base64 of the Developer ID Application .p12, with its intermediate) and APPLE_SIGNING_IDENTITY." >&2
            exit 1
          fi
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          if [ -n "$APPLE_ID" ]; then
            unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8
          else
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            # App Store Connect API key: tauri reads the key from the
            # file APPLE_API_KEY_PATH names.
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            unset APPLE_API_KEY_P8
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          bash scripts/notary-progress.sh &
          progress=$!
          trap 'kill "$progress" 2>/dev/null || true' EXIT
          make desktop-release-bundle VERSION="$TAG" DEV=

      # A dev build: ad-hoc signed, not notarized, no updater artifacts, the
      # dmg only (make desktop-release-bundle DEV=1).
      - name: Package (dev build)
        if: env.DEV == 'true'
        run: make desktop-release-bundle VERSION="$TAG" DEV=1

      - name: Remove the keychain and keys
        if: always() && env.DEV != 'true'
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos
          path: |
            dist/Kivali_*_aarch64.dmg
            dist/Kivali.app.tar.gz
            dist/Kivali.app.tar.gz.sig
          retention-days: 7
          if-no-files-found: error

  desktop-windows:
    name: Kivali Desktop (Windows x64)
    needs: [verify, images]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ needs.verify.outputs.version }}
      DEV: ${{ needs.verify.outputs.dev }}
    # Git Bash, not pwsh: the Makefiles' recipes are POSIX shell, and
    # pwsh judges a multi-line step by its last command's exit code only.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop-app/package-lock.json

      # Pinned in lockstep with desktop-app/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: '1.99.0'

      # As desktop-macos: nightly.yml's release-profile cache, restored
      # and never saved.
      - name: Only the pinned Rust toolchain
        uses: ./.github/actions/only-pinned-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v0-rust-1.99.0
          shared-key: desktop-release
          workspaces: desktop-app/src-tauri
          save-if: false

      # GNU make, which the hosted Windows image lacks
      # (.github/actions/gnu-make).
      - name: GNU make
        uses: ./.github/actions/gnu-make

      - name: Dev version
        if: env.DEV == 'true'
        run: bash scripts/bump-version.sh "$TAG"

      # The amd64 VM image, bundled as <install dir>\vm\root.vhdx
      # (desktop-app/Makefile VM_BUNDLE).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vm-amd64
          path: vm/build/out

      # Everything the installer is made of, with no secret in reach: the
      # web app, every crate with its build script and macros, the sidecar
      # built with Go for windows/amd64 and stamped with the version, and
      # the license notices (make desktop-release-compile). The project's
      # dependencies run here and only here.
      - name: Compile
        run: make desktop-release-compile VERSION="$TAG"

      # Microsoft's Artifact Signing client, the signtool dlib that
      # desktop-app/scripts/sign-windows.ps1 signs through: the NuGet
      # package (a zip), pinned by version and by SHA-512, unpacked
      # under the runner's temp dir. The hash is the package's as the
      # NuGet catalog lists it (packageHash, docs/developers/releasing.md
      # says how to read it for a new version); a download that does not
      # match is not unpacked. signtool itself and the .NET 8 runtime are
      # the image's. Only a release signs; a dev build ships the
      # installer unsigned.
      - name: Artifact Signing client
        if: env.DEV != 'true'
        shell: pwsh
        env:
          ARTIFACT_SIGNING_CLIENT_SHA512: fc6d211bf543212ea9b16db76f9b7557f3912209f43d500eb468fdc3e8643e602e238a5e9a97f0956e741361ad1ec727cfdfb9433de16c2e2671bede8f6627d4
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'artifact-signing-client.zip'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.146/microsoft.artifactsigning.client.1.0.146.nupkg' -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA512 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:ARTIFACT_SIGNING_CLIENT_SHA512) {
            throw "Microsoft.ArtifactSigning.Client 1.0.146: SHA-512 is $actual, expected $env:ARTIFACT_SIGNING_CLIENT_SHA512"
          }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'artifact-signing-client')
          Get-Item (Join-Path $env:RUNNER_TEMP 'artifact-signing-client\bin\x64\Azure.CodeSigning.Dlib.dll') | Out-Null

      # The only step that holds the keys: the tauri CLI packages what
      # Compile built into the NSIS installer, Authenticode-signing the
      # sidecar, Kivali.exe, NSIS's plugins, the uninstaller and the
      # installer through Azure Artifact Signing
      # (desktop-app/scripts/sign-windows.ps1, the AZURE_* and
      # ARTIFACT_SIGNING_* secrets), and signs the installer for the
      # updater; then Kivali_X.Y.Z_x64-setup.exe and its .sig are copied
      # into dist/ (make desktop-release-bundle). A dev build packages
      # the installer only, with no key and no signing (DEV=1).
      - name: Package and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.DEV != 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.DEV != 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ env.DEV != 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.DEV != 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.DEV != 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ env.DEV != 'true' && secrets.ARTIFACT_SIGNING_ENDPOINT || '' }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ env.DEV != 'true' && secrets.ARTIFACT_SIGNING_ACCOUNT || '' }}
          ARTIFACT_SIGNING_PROFILE: ${{ env.DEV != 'true' && secrets.ARTIFACT_SIGNING_PROFILE || '' }}
          ARTIFACT_SIGNING_CLIENT: ${{ runner.temp }}\artifact-signing-client
        run: make desktop-release-bundle VERSION="$TAG" DEV=${{ env.DEV == 'true' && '1' || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows
          path: |
            dist/Kivali_*_x64-setup.exe
            dist/Kivali_*_x64-setup.exe.sig
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release
    # Every build and every test must succeed: a failed or cancelled job
    # publishes nothing.
    needs: [checks, nightly, verify, images, chart, licenses, feed, desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.version }}
      DEV: ${{ needs.verify.outputs.dev }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{images-*,chart,licenses,release-json,desktop-*}'
          path: assets
          merge-multiple: true

      # The VM images ship inside the installers; only their package lists
      # and SOURCES.md are published: the arm64 one's as packages.txt and
      # SOURCES.md, the amd64 one's as vm-amd64-packages.txt and
      # vm-amd64-SOURCES.md.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vm-sources-arm64
          path: assets

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vm-sources-amd64
          path: vm-amd64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sources-*
          path: sources
          merge-multiple: true

      - name: The amd64 VM image's package list and SOURCES.md
        run: |
          cp vm-amd64/packages.txt assets/vm-amd64-packages.txt
          cp vm-amd64/SOURCES.md assets/vm-amd64-SOURCES.md

      # The arm64 VM image's SOURCES.md (from its images job) covers that VM;
      # the images' Debian packages (both architectures') and the egress
      # proxy's base are appended.
      - name: SOURCES.md
        run: |
          for f in sources/*.txt; do
            sh scripts/third-party-sources.sh debian "The $(basename "$f" .txt) image" "$f"
          done >> assets/SOURCES.md
          sh scripts/third-party-sources.sh distroless >> assets/SOURCES.md

      # The updater's feed, from both platforms' updater artifacts;
      # --require fails the release if either is missing. A dev build has
      # no updater artifacts and no feed.
      - name: latest.json
        if: env.DEV != 'true'
        run: bash scripts/latest-json.sh "$TAG" --dir assets --require

      - name: Assets
        run: ls -l assets

      # The release page is where people download the app, among every
      # other asset: the notes open with the two installers, linked, and
      # what each needs (scripts/release-notes.sh). It fails if either
      # installer is missing. A release's generated notes follow them.
      - name: Release notes
        run: |
          if [ "$DEV" = true ]; then
            bash scripts/release-notes.sh "$TAG" --dir assets --dev "$GITHUB_REF_NAME" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          else
            bash scripts/release-notes.sh "$TAG" --dir assets > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      # A draft until every asset is up, so /releases/latest (what the
      # updater and release feeds resolve) never points at a half-uploaded
      # release. Re-running replaces assets (--clobber). A dev build's tag
      # does not exist yet: the release creates it on the commit built
      # when it is published.
      # A release's generated notes start from the last published release
      # below it, not the previous tag: a tag whose release never
      # published shipped nothing, so its changes belong to this one.
      - name: Create the draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          if [ "$DEV" = true ]; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Kivali ${TAG#v} (dev build)" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            pre=""
            case "$TAG" in *-*) pre="--prerelease" ;; esac
            since="$( { gh release list --exclude-drafts --exclude-pre-releases --limit 200 \
                          --json tagName --jq '.[].tagName'; echo "$TAG"; } |
              sort -uV | grep -B1 -xF "$TAG" | grep -vxF "$TAG" || true)"
            start=""
            if [ -n "$since" ]; then
              echo "Generated notes start from $since"
              start="--notes-start-tag $since"
            fi
            gh release create "$TAG" --draft --verify-tag --title "Kivali ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $start $pre
          fi

      - name: Upload the assets
        run: gh release upload "$TAG" assets/* --clobber

      - name: Publish
        run: gh release edit "$TAG" --draft=false
